name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly build from main (Mondays at 6am UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      tiledbsoma_ref:
        description: "TileDB-SOMA ref to build (branch/tag/sha)"
        default: "main"
      image_tag:
        description: "Image tag to apply (e.g., latest, stable)"
        default: "latest"

# The stable TileDB-SOMA release version
# Update this when a new release is available and push to main
env:
  STABLE_SOMA_REF: "1.15.5"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tiledbsoma

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set build parameters
        id: params
        run: |
          # Determine image tag based on trigger
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            IMAGE_TAG="${{ inputs.image_tag }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            IMAGE_TAG="pr-${{ github.event.number }}"
          else
            IMAGE_TAG="latest"
          fi

          # For stable builds, use the pinned release version; otherwise use input or main
          if [[ "$IMAGE_TAG" == "stable" ]]; then
            SOMA_REF="${{ env.STABLE_SOMA_REF }}"
            CACHE_SUFFIX="-stable"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            SOMA_REF="${{ inputs.tiledbsoma_ref }}"
            CACHE_SUFFIX=""
          else
            SOMA_REF="main"
            CACHE_SUFFIX=""
          fi

          # PR builds: single platform, local images only
          # All other builds: multi-arch, push to registry
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PLATFORMS="linux/amd64"
            PUSH="false"
          else
            PLATFORMS="linux/amd64,linux/arm64"
            PUSH="true"
          fi

          {
            echo "image_tag=$IMAGE_TAG"
            echo "soma_ref=$SOMA_REF"
            echo "cache_suffix=$CACHE_SUFFIX"
            echo "platforms=$PLATFORMS"
            echo "push=$PUSH"
          } >> "$GITHUB_OUTPUT"

      # Required for ARM64 emulation (only needed for multi-arch push builds)
      - uses: docker/setup-qemu-action@v3
        if: github.event_name != 'pull_request'

      # Use docker driver for PRs (allows local image sharing between builds)
      # Use docker-container driver for push builds (required for multi-arch)
      - uses: docker/setup-buildx-action@v3
        with:
          driver: ${{ github.event_name == 'pull_request' && 'docker' || 'docker-container' }}

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # Base image
      # =========================================================================
      - name: Docker meta (base)
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-base
          tags: |
            type=raw,value=${{ steps.params.outputs.image_tag }}
            type=sha,prefix=sha-

      - name: Build base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: ${{ steps.params.outputs.push }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            TILEDBSOMA_REF=${{ steps.params.outputs.soma_ref }}
          tags: ${{ github.event_name == 'pull_request' && 'tiledbsoma-base:local' || steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha,scope=base${{ steps.params.outputs.cache_suffix }}
          cache-to: type=gha,mode=max,scope=base${{ steps.params.outputs.cache_suffix }}

      # =========================================================================
      # R image
      # =========================================================================
      - name: Docker meta (r)
        id: meta-r
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-r
          tags: |
            type=raw,value=${{ steps.params.outputs.image_tag }}
            type=sha,prefix=sha-

      - name: Build R
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/r.Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: ${{ steps.params.outputs.push }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ github.event_name == 'pull_request' && 'tiledbsoma-base:local' || format('{0}-base:{1}', env.IMAGE_PREFIX, steps.params.outputs.image_tag) }}
            TILEDBSOMA_REF=${{ steps.params.outputs.soma_ref }}
          tags: ${{ github.event_name == 'pull_request' && 'tiledbsoma-r:local' || steps.meta-r.outputs.tags }}
          labels: ${{ steps.meta-r.outputs.labels }}
          cache-from: type=gha,scope=r${{ steps.params.outputs.cache_suffix }}
          cache-to: type=gha,mode=max,scope=r${{ steps.params.outputs.cache_suffix }}

      # =========================================================================
      # Python image
      # =========================================================================
      - name: Docker meta (python)
        id: meta-python
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-python
          tags: |
            type=raw,value=${{ steps.params.outputs.image_tag }}
            type=sha,prefix=sha-

      - name: Build Python
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/python.Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: ${{ steps.params.outputs.push }}
          load: ${{ github.event_name == 'pull_request' }}
          build-args: |
            BASE_IMAGE=${{ github.event_name == 'pull_request' && 'tiledbsoma-base:local' || format('{0}-base:{1}', env.IMAGE_PREFIX, steps.params.outputs.image_tag) }}
            TILEDBSOMA_REF=${{ steps.params.outputs.soma_ref }}
          tags: ${{ github.event_name == 'pull_request' && 'tiledbsoma-python:local' || steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha,scope=python${{ steps.params.outputs.cache_suffix }}
          cache-to: type=gha,mode=max,scope=python${{ steps.params.outputs.cache_suffix }}