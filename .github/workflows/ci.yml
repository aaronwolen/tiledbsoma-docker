name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly build from main (Mondays at 6am UTC)
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      tiledbsoma_ref:
        description: "TileDB-SOMA ref to build (branch/tag/sha)"
        default: "main"
      image_tag:
        description: "Image tag to apply (e.g., latest, stable)"
        default: "latest"

# The stable TileDB-SOMA release version
# Update this when a new release is available and push to main
env:
  STABLE_SOMA_REF: "1.15.5"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tiledbsoma

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Determine the SOMA ref and image tag based on trigger
      - name: Set build parameters
        id: params
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "soma_ref=${{ inputs.tiledbsoma_ref }}" >> $GITHUB_OUTPUT
            echo "image_tag=${{ inputs.image_tag }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "soma_ref=main" >> $GITHUB_OUTPUT
            echo "image_tag=pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          else
            # push to main or scheduled build
            echo "soma_ref=main" >> $GITHUB_OUTPUT
            echo "image_tag=latest" >> $GITHUB_OUTPUT
          fi
          # For PRs, only build amd64; for pushes, build both architectures
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "platforms=linux/amd64" >> $GITHUB_OUTPUT
            echo "push=false" >> $GITHUB_OUTPUT
          else
            echo "platforms=linux/amd64,linux/arm64" >> $GITHUB_OUTPUT
            echo "push=true" >> $GITHUB_OUTPUT
          fi

      # Required for ARM64 emulation
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # =========================================================================
      # Base image
      # =========================================================================
      - name: Docker meta (base)
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-base
          tags: |
            type=raw,value=${{ steps.params.outputs.image_tag }}
            type=sha,prefix=sha-

      - name: Build and push base
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          build-args: TILEDBSOMA_REF=${{ steps.params.outputs.soma_ref }}
          tags: ${{ steps.meta-base.outputs.tags }}
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base

      # For PRs, build base locally (single platform) to validate
      - name: Build base (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base.Dockerfile
          load: true
          build-args: TILEDBSOMA_REF=${{ steps.params.outputs.soma_ref }}
          tags: tiledbsoma-base:local
          cache-from: type=gha,scope=base

      # =========================================================================
      # R image
      # =========================================================================
      - name: Docker meta (r)
        id: meta-r
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-r
          tags: |
            type=raw,value=${{ steps.params.outputs.image_tag }}
            type=sha,prefix=sha-

      - name: Build and push R
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/r.Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-base:${{ steps.params.outputs.image_tag }}
            TILEDBSOMA_REF=${{ steps.params.outputs.soma_ref }}
          tags: ${{ steps.meta-r.outputs.tags }}
          labels: ${{ steps.meta-r.outputs.labels }}
          cache-from: type=gha,scope=r
          cache-to: type=gha,mode=max,scope=r

      - name: Build R (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/r.Dockerfile
          load: true
          build-args: |
            BASE_IMAGE=tiledbsoma-base:local
            TILEDBSOMA_REF=${{ steps.params.outputs.soma_ref }}
          tags: tiledbsoma-r:local
          cache-from: type=gha,scope=r

      # =========================================================================
      # Python image
      # =========================================================================
      - name: Docker meta (python)
        id: meta-python
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-python
          tags: |
            type=raw,value=${{ steps.params.outputs.image_tag }}
            type=sha,prefix=sha-

      - name: Build and push Python
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/python.Dockerfile
          platforms: ${{ steps.params.outputs.platforms }}
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE_PREFIX }}-base:${{ steps.params.outputs.image_tag }}
            TILEDBSOMA_REF=${{ steps.params.outputs.soma_ref }}
          tags: ${{ steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha,scope=python
          cache-to: type=gha,mode=max,scope=python

      - name: Build Python (PR validation)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/python.Dockerfile
          load: true
          build-args: |
            BASE_IMAGE=tiledbsoma-base:local
            TILEDBSOMA_REF=${{ steps.params.outputs.soma_ref }}
          tags: tiledbsoma-python:local
          cache-from: type=gha,scope=python