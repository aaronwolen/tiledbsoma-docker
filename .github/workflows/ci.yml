name: CI
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/tiledbsoma

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta (base)
        id: meta-base
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-base
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build base
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/base.Dockerfile
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta-base.outputs.tags }}
            tiledbsoma-base:local
          labels: ${{ steps.meta-base.outputs.labels }}
          cache-from: type=gha,scope=base
          cache-to: type=gha,scope=base,mode=max

      - name: Docker meta (r)
        id: meta-r
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-r
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build R
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/r.Dockerfile
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: BASE_IMAGE=tiledbsoma-base:local
          tags: ${{ steps.meta-r.outputs.tags }}
          labels: ${{ steps.meta-r.outputs.labels }}
          cache-from: type=gha,scope=r
          cache-to: type=gha,scope=r,mode=max

      - name: Docker meta (python)
        id: meta-python
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}-python
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build Python
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/python.Dockerfile
          load: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: BASE_IMAGE=tiledbsoma-base:local
          tags: ${{ steps.meta-python.outputs.tags }}
          labels: ${{ steps.meta-python.outputs.labels }}
          cache-from: type=gha,scope=python
          cache-to: type=gha,scope=python,mode=max